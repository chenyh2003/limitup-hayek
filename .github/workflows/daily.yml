name: Daily limit-up snapshot

on:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '40 7 * * 1-5'
    - cron: '50 7 * * 1-5'
    - cron: '0 8 * * 1-5'
    - cron: '15 8 * * 1-5'
  workflow_dispatch:
    inputs:
      date:
        description: '交易日 YYYYMMDD（留空 = 今天）'
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - 'tests/**'
      - 'data/**'
      - '.github/workflows/daily.yml'
      - 'README.md'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test
        run: node --test

      - name: Check freshness
        id: freshness
        if: github.event_name == 'schedule'
        run: |
          node -e '
          const fs = require("fs");
          const now = new Date();
          const cstDate = new Intl.DateTimeFormat("en-CA", {
            timeZone: "Asia/Shanghai", year: "numeric", month: "2-digit", day: "2-digit"
          }).format(now);
          const file = `data/${cstDate}.json`;
          let skip = false;
          if (fs.existsSync(file)) {
            const snapshot = JSON.parse(fs.readFileSync(file, "utf8"));
            const hour = Number(new Intl.DateTimeFormat("en-GB", {
              timeZone: "Asia/Shanghai", hour: "2-digit", hour12: false
            }).format(new Date(snapshot.capturedAt)));
            skip = hour >= 15;
          }
          console.log(`skip=${skip}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `skip=${skip}\n`);
          '

      - name: Fetch snapshot
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true')
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/fetch.mjs --date="${{ inputs.date }}"
          else
            node scripts/fetch.mjs
          fi

      - name: Commit data
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/; then
            git add data/
            git commit -m "data: limit-up snapshot"
            git push origin HEAD:main
          fi

      - name: Build site
        if: github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true'
        run: |
          mkdir -p _site
          cp -r index.html assets data .nojekyll _site/

      - uses: actions/configure-pages@v5
        if: github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true'
        with:
          path: _site

      - name: Deploy
        id: deployment
        if: github.event_name != 'schedule' || steps.freshness.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
